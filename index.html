<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskmaster</title>
  <script src="todo.js" defer></script>
</head>

<body>
  <header class="header" id="nav-bar">
    <h2 class="app-name">My Task Master</h2>
  </header>
  <main id="container">
    <section class="new-task">
      <div class="new-task-container">
        <p id="new-task-test">Create a new task today</p>
        <button class="button" type="submit" id="create-task">Create task</button>
      </div>
    </section>
    <section class="task-list">
      <div class="my-tasks" id="my-tasks">
        <div class="active-task">
          
        </div>
        
      </div>
    </section>
    <section class="completed-task">
      <div class="completed" id="complete">
        <p id="complete_task_text">Bravo👏 you have completed these tasks!</p>
      </div>
    </section>
    <section class="task-stat">
      
    </section>
  </main>
  <footer class="">
    
  </footer>
</body>

</html>
